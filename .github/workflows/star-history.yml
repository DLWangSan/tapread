name: Star History

on:
  schedule:
    - cron: "0 */12 * * *"
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render star history
        uses: narayann7/star-history-action@v1
        with:
          repos: ${{ github.repository }}
          output-dir: assets/star-history
          # After June 2026 GitHub stargazer API restrictions, live
          # api.star-history.com embeds are blank for most repos.
          # This action renders with the repo's own GITHUB_TOKEN.
          update-readme: true
          readme: README.md
          readme-format: picture
